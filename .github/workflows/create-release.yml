name: Create Release (Auto Bump Patch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next available tag from VERSION
        id: next_tag
        run: |
          if [ ! -f VERSION ]; then
            echo "VERSION file is required as the single source of truth"
            exit 1
          fi

          RAW_VERSION="$(tr -d '[:space:]' < VERSION)"
          BASE_VERSION="${RAW_VERSION%%+*}"
          BUILD_NUMBER="${RAW_VERSION##*+}"
          if [ "${BUILD_NUMBER}" = "${RAW_VERSION}" ]; then
            BUILD_NUMBER="0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VERSION}"

          if [ -z "${MAJOR}" ] || [ -z "${MINOR}" ] || [ -z "${PATCH}" ]; then
            echo "Failed to parse VERSION: ${RAW_VERSION}"
            exit 1
          fi

          NEXT_PATCH="${PATCH}"
          while true; do
            CANDIDATE_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
            if git ls-remote --tags origin "refs/tags/${CANDIDATE_TAG}" | grep -q .; then
              NEXT_PATCH="$((NEXT_PATCH + 1))"
            else
              break
            fi
          done

          NEXT_BUILD="$((BUILD_NUMBER + 1))"
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}+${NEXT_BUILD}"

          echo "tag=${CANDIDATE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${NEXT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${CANDIDATE_TAG} (VERSION -> ${NEXT_VERSION})"

      - name: Update VERSION and sync pubspec
        run: |
          echo "${{ steps.next_tag.outputs.version }}" > VERSION
          chmod +x tool/sync_version.sh
          ./tool/sync_version.sh

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION pubspec.yaml
          if git diff --cached --quiet; then
            echo "No version file changes to commit"
          else
            git commit -m "chore: bump VERSION to ${{ steps.next_tag.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_tag.outputs.tag }}
          target_commitish: main
          generate_release_notes: true
